parameters:
  uwauth.skip_procedural_hook_scan: true
  uwauth.channel: 'uwauth'
  uwauth.severity:
    ad_sync: 'debug'
    gws_sync: 'debug'
    local_sync: 'debug'
  uwauth.verbose: false

services:
  _defaults:
    autoconfigure: true
    autowire: true
  logger.channel.uwauth:
    parent: 'logger.channel_base'
    arguments: ['%uwauth.channel%']
  uwauth.debug:
    class: Drupal\uwauth\Debug
  Drupal\uwauth\EventSubscriber\LogoutOverride: ~
  Drupal\uwauth\EventSubscriber\UwAuthSubscriber: ~